name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'integration/**']
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check HTML files exist
        run: test -f index.html && test -f site.html
      - name: Check diacritics (user-facing copy)
        run: |
          chmod +x shared/check-diacritics.sh
          ./shared/check-diacritics.sh
      - name: Check CSS comments (anti-regression #275)
        run: |
          chmod +x shared/check-css-comments.sh
          ./shared/check-css-comments.sh
      - name: Run lint script tests
        run: |
          chmod +x tests/test-check-diacritics.sh
          ./tests/test-check-diacritics.sh
      - name: Run CSS comments script tests (anti-regression #275)
        run: |
          chmod +x tests/test-check-css-comments.sh
          ./tests/test-check-css-comments.sh
      - name: Check hardcoded tokens (anti-regression #279)
        run: |
          chmod +x shared/check-hardcoded-tokens.sh
          ./shared/check-hardcoded-tokens.sh
      - name: Check graph.css isolation (anti-barrel, #657)
        run: |
          chmod +x shared/check-graph-isolation.sh
          ./shared/check-graph-isolation.sh
      - name: Graph lib unit tests (pointerDrag/svg/sweep, #657)
        run: npm run test:graph-lib
      - name: Graph model unit tests (GraphModel/toModel, #665)
        run: npm run test:graph-model
      - name: Graph layout unit tests (fixed/tree/a11y-table, #666)
        run: npm run test:graph-layout
      - name: Graph radial/auto-detect unit tests (#669, I3-1)
        run: npm run test:graph-layout-radial
      - name: Graph layered(dagre)/mindmap unit tests (#670, I3-2)
        run: npm run test:graph-layout-layered
      - name: Graph viewport pan/zoom/pinch unit tests (#667, I2-1)
        run: npm run test:graph-viewport
      - name: Graph spanning-tree unit tests (#671, I4-1)
        run: npm run test:graph-spanning-tree
      - name: Graph edit-focus unit tests (#673, I5-1)
        run: npm run test:graph-edit-focus
      - name: Graph port-drop unit tests (#674, I5-2)
        run: npm run test:graph-port-drop
      - name: Graph history (undo/redo) unit tests (#675, I5-3)
        run: npm run test:graph-history
      - name: Graph IO unit tests — round-trip JSON, Cytoscape/DOT import (#664, I6)
        run: npm run test:graph-io
      - name: Run hardcoded tokens script tests (anti-regression #279)
        run: |
          chmod +x tests/test-check-hardcoded-tokens.sh
          ./tests/test-check-hardcoded-tokens.sh
      - name: Check versions sync (anti-regression #377)
        run: |
          chmod +x shared/check-versions.sh
          ./shared/check-versions.sh
      - name: Run versions sync script tests (anti-regression #377)
        run: |
          chmod +x tests/test-check-versions.sh
          ./tests/test-check-versions.sh
      - name: nav.js syntax regression (#206, #378)
        run: npm run test:syntax
      - name: Check innerHTML anti-XSS gate (#758)
        run: node bin/check-innerhtml.js
      - name: Run innerHTML gate script tests (#758)
        run: |
          chmod +x tests/test-check-innerhtml.sh
          ./tests/test-check-innerhtml.sh
      # check-components.sh lint le registre / les consommateurs hors DS.
      # Lance sur shared/css (CSS du DS) : 11 warnings de dette preexistante
      # (classes modifier ex: .tooltip--left non enumerees dans le registre).
      # continue-on-error tant que la dette n'est pas resorbee (cf. #378).
      - name: check-components registry lint (#378, warn-only)
        run: |
          chmod +x shared/check-components.sh
          ./shared/check-components.sh shared/css
        continue-on-error: true
      # Garde-fou « classe posee par le JS mais absente du CSS partage » (#765).
      # warn-only pour cette 1ere version (objectif = produire l'inventaire,
      # pas bloquer) — un passage --strict bloquant viendra une fois la dette
      # resorbee (cf. #749/#763/#596, meme defaut recurrent).
      - name: Check dead classes -- JS pose une classe absente du CSS (#765, warn-only)
        run: node bin/check-dead-classes.js
        continue-on-error: true
      - name: Run dead classes gate script tests (#765)
        run: |
          chmod +x tests/test-check-dead-classes.sh
          ./tests/test-check-dead-classes.sh
      # --example-strict (#789, suite #781/#748) : bascule bloquante du champ
      # `example` -- l'inventaire des 21 defauts historiques a ete assaini
      # par #781 (21 -> 0), puis les 3 residuels relevés au passage (fab,
      # context-menu, carousel) par #789. Registre propre -> bloquant desormais,
      # sinon la derive silencieuse (meme mecanisme que les 21 defauts
      # initiaux) recommence. --frontier-strict reste warn-only (hors
      # perimetre #789, cf. #508).
      - name: Registry validation — phantoms (#516) + React parity (#523) + frontière (#511) + example strict (#748/#789)
        run: node bin/generate-registry.js --check --example-strict
      - name: extractReactClasses BEM classes unit tests (#747)
        run: |
          chmod +x tests/test-extract-react-classes-bem.sh
          ./tests/test-extract-react-classes-bem.sh
      - name: Registry example field validation unit tests (#748)
        run: |
          chmod +x tests/test-validate-example.sh
          ./tests/test-validate-example.sh
      # Parsing statique pur (node, zéro navigateur, zéro dépendance) — < 5s.
      - name: Nav sections manifest validation (#528)
        run: node bin/generate-nav-sections.js --check
      - name: Version notes inline validation (#645)
        run: node bin/generate-version-notes.js --check
      - name: Version notes generator tests (#645)
        run: npm run test:version-notes
      - name: Component counter sync — registre <-> site.html <-> ARCHITECTURE.md (#707)
        run: |
          chmod +x shared/check-counters.sh
          ./shared/check-counters.sh
      - name: Counters generator validation (#707)
        run: node bin/generate-counters.js --check
  # shared/components.js — suite vitest (jsdom) sur composants vanilla (#744).
  # Reutilise Vitest (deja devDependency de packages/react, hoiste au root
  # node_modules via les workspaces npm) plutot que d'introduire un 2e outil.
  # shared/components.js n'est pas un module ES (fonctions globales exposees
  # via window.__initX) : les tests le chargent via jsdom + dom.window.eval()
  # pour executer le VRAI script dans le contexte d'une fenetre (voir
  # tests/vanilla/helpers/load-components.js). Amorce = 3 composants critiques
  # (initContextMenu #750, initCalendar, initJsonViewer) — les ~37 autres
  # restent a decouper par famille (cf. #744). Bloquant pour la partie couverte.
  vanilla-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vanilla components unit tests (jsdom, #744)
        run: npm run test:vanilla
  # @msyx-dev/react (packages/react) — suite vitest (jsdom).
  # Le chemin corepack + pnpm install --frozen-lockfile sur Node 24 est
  # confirme vert : il s'execute et rapporte ses resultats a chaque PR.
  # Bloquant depuis #745 — avant ça, continue-on-error faisait que le
  # check `react` affichait `pass` quel que soit le resultat des tests :
  # aucune garantie reelle (risque identifie au groom de #600), seule
  # l'execution manuelle de `pnpm test` validait effectivement les
  # wrappers.
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Enable corepack
        run: corepack enable
      - name: Install deps (pnpm, frozen lockfile)
        run: |
          cd packages/react
          pnpm install --frozen-lockfile
      - name: Run react tests (vitest)
        run: |
          cd packages/react
          pnpm test
  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run perf budget (warn-only)
        run: |
          chmod +x shared/perf-budget.sh
          ./shared/perf-budget.sh
        continue-on-error: true
      - name: Emit summary
        run: |
          echo "## Perf budget report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./shared/perf-budget.sh >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
