name: Visual regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'integration/**']
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # #851 : matrice reduite. AVANT : 16 projets x 123 sections = 1968 captures,
      # workers:1, 7 derniers runs mesures a 53-60m17s (cancelled a la limite de 60 min sur les plus
      # recents, cf gh run list) -> job mort, timeout-minutes:60 (#849) insuffisant. APRES : MSYX
      # garde la matrice complete (4 projets x toutes les sections), ACSSI/Nhood/Auchan passent
      # desktop-only + sections sentinelles (SENTINEL_SECTIONS, visual-tests/visual.spec.ts) ->
      # 612 captures (-69%). Marge large volontaire (pas 1 min, cf #863 lighthouse) : ajuster a la
      # baisse une fois plusieurs runs CI reels observes sous ce timeout.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run visual tests
        run: npm run test:visual
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
