<!DOCTYPE html>
<html lang="fr" data-theme="msyx" data-mode="dark">
<head>
<meta charset="UTF-8" />
<title>Card floating panel clip fixture (#856) — msyx.design</title>
<link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
  <!--
    Fixture dediee (#856) — decouplee des pages showcase (le Dropdown de
    formulaires.html et l'ActionMenu de navigation.html n'y sont pas
    imbriques dans un .card, donc aucune page existante ne reproduit le
    defaut). Markup calque verbatim sur pages/formulaires.html#dropdown et
    la JSDoc initActionMenu (shared/components.js), simplement pose dans
    une .card reelle (classe DS, pas de style maison) pour reproduire
    exactement le motif signale sur KeepThread : Dropdown/ActionMenu dans
    une .card (overflow:hidden + will-change:transform + container-type).
  -->
  <!-- margin-left genereux : isole la question testee (clip par .card) de
       tout artefact du viewport (un menu droit-aligne sur un declencheur
       colle au bord gauche de l'ecran deborderait hors-viewport meme SANS
       aucun bug .card — sans rapport avec #856). -->
  <div style="margin: 40px 0 40px 400px;">
    <div class="card" style="max-width:280px;">
      <h3>Nouveau Perimetre</h3>
      <div class="dropdown" id="dd">
        <div class="dropdown-trigger" id="dd-trigger"><span class="dropdown-value" id="dd-value">Choisir un framework...</span><span class="arrow">&#9662;</span></div>
        <div class="dropdown-menu" id="dd-menu">
          <div class="dropdown-option">Next.js</div>
          <div class="dropdown-option">Nuxt.js</div>
          <div class="dropdown-option">SvelteKit</div>
          <div class="dropdown-option">Remix</div>
          <div class="dropdown-option" id="dd-target">Astro</div>
        </div>
      </div>
    </div>

    <div class="card card-compact" style="max-width:280px; margin-top:120px;">
      <!-- header realiste : titre + declencheur du menu Actions aligne a
           droite de la carte (motif reel KeepThread — panneau de detail
           d'un Perimetre), pas colle au bord gauche du viewport.
           .card-compact (modificateur DS reel, cards.css) : padding reduit
           (space-5 vs space-xl) — le panneau du menu Actions deborde de la
           carte des la 1ere option des l'ouverture, calque le rapport
           KeepThread ("le menu Actions ... est incliquable", pas seulement
           sa derniere option). -->
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h3 style="margin:0;">Perimetre — Ventes Nord</h3>
        <div class="action-menu-wrap" id="am">
          <button class="action-menu-trigger" id="am-trigger" aria-haspopup="menu" aria-expanded="false">&#8942;</button>
          <div class="action-menu" id="am-menu">
            <button class="action-menu-item" id="am-rename" onclick="document.getElementById('am-log').textContent='renommer-clique'">Renommer</button>
            <button class="action-menu-item">Deplacer</button>
            <button class="action-menu-item">Ajouter un sous-Perimetre</button>
            <button class="action-menu-item">Supprimer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="am-log">non-clique</div>

  <script src="/shared/components.js"></script>
</body>
</html>
